<!DOCTYPE html>
<html lang="ko-KR">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1">
  <meta name="msapplication-TileColor" content="#2b5797">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:url" content="https://youngweld.co.kr">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Youngil Electric">
  <meta property="og:description" content="All about welding machines">
  <meta property="og:image" content="https://youngweld.co.kr//static/images/logo.png">
  <meta property="og:image:width" content="100">
  <meta property="og:image:height" content="100">
  <link rel="apple-touch-icon" sizes="76x76" href="<%= BASE_URL %>static/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="<%= BASE_URL %>static/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="<%= BASE_URL %>static/favicon/favicon-16x16.png">
  <link rel="manifest" href="<%= BASE_URL %>static/favicon/site.webmanifest">
  <link rel="mask-icon" href="<%= BASE_URL %>static/favicon/safari-pinned-tab.svg" color="#005b98">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Teko:wght@500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet preload" href="<%= BASE_URL %>static/styles/fourshome/core.css" as="style" type="text/css">
  <link rel="stylesheet preload" href="<%= BASE_URL %>static/styles/animate/animate.min.css" as="style" type="text/css">
  <title>
    <%= htmlWebpackPlugin.options.title %>
  </title>
</head>

<body>
  <noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong>
  </noscript>
  <div id="app"></div>
  <!-- built files will be auto injected -->
</body>

</html>
