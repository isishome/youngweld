name: CloudFront 설정 검토 및 적용

on:
  workflow_dispatch:
    inputs:
      routes_only:
        description: '기존 보안 헤더 정책을 보존하고 경로 함수만 갱신'
        type: boolean
        default: true
        required: true
      apply:
        description: '조회된 변경 계획을 실제 적용'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: cloudfront-settings
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws_cicd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: 경로와 설정 병합 검사
        run: node --test tests/routing.test.mjs tests/cloudfront.test.mjs
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: CloudFront 조회 또는 적용
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          APPLY_CHANGES: ${{ inputs.apply }}
          ROUTES_ONLY: ${{ inputs.routes_only }}
        run: node scripts/configure-cloudfront.mjs
